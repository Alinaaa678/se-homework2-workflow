<script>
const FLOW = {"name": "code-review-workflow-parallel", "description": "编码 → 并行双路审查（正确性+风格）→ (任一不通过则)修复 → 再审查", "start": "coder", "nodes": [{"id": "coder", "agent": "coder", "input": {"requirement": "requirement"}, "output": "code"}, {"id": "reviews", "type": "parallel", "tasks": [{"id": "correctness", "agent": "reviewer_correctness", "input": {"code": "code"}, "output": "review_correctness"}, {"id": "style", "agent": "reviewer_style", "input": {"code": "code"}, "output": "review_style"}], "reduce": "merge_reviews", "output": "review"}, {"id": "fixer", "agent": "fixer", "input": {"code": "code", "review": "review"}, "output": "code"}], "edges": [{"from": "coder", "to": "reviews"}, {"from": "reviews", "to": "END", "when": "state['review']['passed']"}, {"from": "reviews", "to": "fixer", "when": "not state['review']['passed']"}, {"from": "fixer", "to": "reviews"}]};

put_key": "review"}, {"event": "message", "ts": 1791950149.332, "from": "coder", "to": "reviews", "kind": "handoff", "payload": {"code": "def divide(a, b):\n    return a / b"}}, {"event": "message", "ts": 1791950149.335, "from": "reviews", "to": "reviews", "kind": "artifact", "payload": {"review_style": "{\"passed\": true, \"issues\": [{\"severity\": \"low\", \"desc\": \"函数名可以更语义化\"}], \"summary\": \"风格良好\"}"}}, {"event": "message", "ts": 1791950149.483, "from": "reviews", "to": "reviews", "kind": "artifact", "payload": {"review_correctness": "{\"passed\": false, \"issues\": [{\"severity\": \"high\", \"desc\": \"除零未处理\"}], \"summary\": \"存在严重问题\", \"run_result\": \"[exit_code=0]\\n…"}}, {"event": "message", "ts": 1791950149.483, "from": "reviews", "to": "reviews", "kind": "artifact", "payload": {"review": "{\"passed\": false, \"issues\": [{\"severity\": \"low\", \"desc\": \"函数名可以更语义化\", \"source\": \"style\"}, {\"severity\": \"high\", \"desc\": \"…"}}, {"event": "step", "run_id": "20261014-115549-47a4fa", "node": "fixer", "agent": "fixer", "visit": 1, "ts": 1791950149.4838188, "duration_ms": 0, "status": "ok", "output_key": "code"}, {"event": "message", "ts": 1791950149.484, "from": "reviews", "to": "fixer", "kind": "handoff", "payload": {"code": "def divide(a, b):\n    return a / b", "review": "{\"passed\": false, \"issues\": [{\"severity\": \"low\", \"desc\": \"函数名可以更语义化\", \"source\": \"style\"}, {\"severity\": \"high\", \"desc\": \"…"}}, {"event": "message", "ts": 1791950149.484, "from": "fixer", "to": "fixer", "kind": "artifact", "payload": {"code": "def fixed():\n    return 42"}}, {"event": "step", "run_id": "20261014-115549-47a4fa", "node": "reviews", "agent": "parallel", "visit": 2, "ts": 1791950149.4838188, "tasks": [{"task": "style", "agent": "reviewer_style", "duration_ms": 0, "output_key": "review_style"}, {"task": "correctness", "agent": "reviewer_correctness", "duration_ms": 155, "output_key": "review_correctness"}], "duration_ms": 155, "status": "ok", "output_key": "review"}, {"event": "message", "ts": 1791950149.484, "from": "fixer", "to": "reviews", "kind": "handoff", "payload": {"code": "def fixed():\n    return 42"}}, {"event": "message", "ts": 1791950149.484, "from": "reviews", "to": "reviews", "kind": "artifact", "payload": {"review_style": "{\"passed\": true, \"issues\": [{\"severity\": \"low\", \"desc\": \"函数名可以更语义化\"}], \"summary\": \"风格良好\"}"}}, {"event": "message", "ts": 1791950149.639, "from": "reviews", "to": "reviews", "kind": "artifact", "payload": {"review_correctness": "{\"passed\": true, \"issues\": [], \"summary\": \"没有问题\", \"run_result\": \"[exit_code=0]\\n(无输出)\"}"}}, {"event": "message", "ts": 1791950149.639, "from": "reviews", "to": "reviews", "kind": "artifact", "payload": {"review": "{\"passed\": true, \"issues\": [{\"severity\": \"low\", \"desc\": \"函数名可以更语义化\", \"source\": \"style\"}], \"summary\": \"[style] 风格良好；[corr…"}}, {"event": "run_end", "run_id": "20261014-115549-47a4fa", "ts": 1791950149.6387658, "status": "success", "error": null, "keys": ["code", "requirement", "review", "review_correctness", "review_style"], "message_count": 12}];
const ARTIFACTS = {"code": "def fixed():\n    return 42", "review": {"passed": true, "issues": [{"severity": "low", "desc": "函数名可以更语义化", "source": "style"}], "summary": "[style] 风格良好；[correctness] 没有问题", "run_result": "[exit_code=0]\n(无输出)"}};

// ---- layered layout: BFS from start, back-edges drawn dashed ----
const nodes = FLOW.nodes, edges = FLOW.edges || [];
const depth = {[FLOW.start]: 0};
let frontier = [FLOW.start];
while (frontier.length) {
  const next = [];
  for (const id of frontier) {
    for (const e of edges) {
      if (e.from !== id || e.to === "END") continue;
      if (depth[e.to] === undefined) { depth[e.to] = depth[id] + 1; next.push(e.to); }
    }
  }
  frontier = next;
}
nodes.forEach(n => { if (depth[n.id] === undefined) depth[n.id] = 0; });
const layers = {};
nodes.forEach(n => { (layers[depth[n.id]] = layers[depth[n.id]] || []).push(n.id); });
const maxDepth = Math.max(...Object.values(depth));
const pos = {};
Object.entries(layers).forEach(([d, ids]) => ids.forEach((id, i) => pos[id] = { x: 80 + d * 260, y: 60 + i * 110 }));
if (edges.some(e => e.to === "END")) pos.END = { x: 80 + (maxDepth + 1) * 260, y: 60 };
const visits = {};
EVENTS.filter(e => e.event === "step").forEach(e => visits[e.node] = Math.max(visits[e.node] || 0, e.visit));

const W = 200, H = 54;
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
let svg = `<svg width="${80 + (maxDepth + 2) * 260}" height="${Math.max(1, ...Object.keys(layers).map(d => layers[d].length)) * 110 + 80}">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/></marker></defs>`;
for (const e of edges) {
  const a = pos[e.from], b = pos[e.to];
  if (!a || !b) continue;
  const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + (e.to === "END" ? 15 : H / 2);
  const back = e.to !== "END" && depth[e.to] <= depth[e.from];
  const path = back
    ? `M${a.x + W / 2},${a.y + H} C${a.x + W / 2},${a.y + H + 45} ${b.x + W / 2},${b.y + H + 45} ${b.x + W / 2},${b.y + H}`
    : `M${x1},${y1} C${x1 + 60},${y1} ${x2 - 60},${y2} ${x2},${y2}`;
  svg += `<path class="edge ${back ? "edge-back" : ""}" d="${path}"/>`;
  if (e.when) svg += `<text class="edge-label" x="${(x1 + x2) / 2}" y="${(y1 + y2) / 2 - 6}">${esc(e.when)}</text>`;
}
for (const n of nodes) {
  const p = pos[n.id], isPar = n.type === "parallel";
  const sub = isPar ? "并行: " + n.tasks.map(t => t.agent).join(" + ") : (n.agent || "");
  const v = visits[n.id] ? ` ×${visits[n.id]}` : "";
  svg += `<rect class="node-box ${isPar ? "node-parallel" : ""}" x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="8"/>
  <text class="node-text" x="${p.x + W / 2}" y="${p.y + 24}" text-anchor="middle" font-weight="700">${esc(n.id)}${v}</text>
  <text class="node-text" x="${p.x + W / 2}" y="${p.y + 42}" text-anchor="middle" fill="#6b7280">${esc(sub)}</text>`;
}
if (pos.END) svg += `<circle cx="${pos.END.x + 15}" cy="${pos.END.y + 15}" r="16" fill="#16a34a"/><text x="${pos.END.x + 15}" y="${pos.END.y + 19}" text-anchor="middle" fill="#fff" font-size="10" font-weight="700">END</text>`;
svg += "</svg>";
document.getElementById("diagram").innerHTML = svg;

// ---- steps timeline ----
const steps = EVENTS.filter(e => e.event === "step");
let rows = steps.map(s => {
  const taskDetail = (s.tasks || []).map(t => `${esc(t.task)}(${esc(t.agent)}) ${t.duration_ms}ms`).join("<br>");
  return `<tr class="${s.status === "ok" ? "" : "err"}"><td>${s.node}</td><td>${s.visit}</td><td>${s.agent}</td>
    <td>${s.duration_ms ?? "-"}ms${taskDetail ? "<br>" + taskDetail : ""}</td>
    <td>${s.status === "ok" ? "✅ " + esc(String(s.output_key)) : "❌ " + esc(s.error || "")}</td></tr>`;
}).join("");
document.getElementById("steps").innerHTML =
  `<table><tr><th>节点</th><th>第几次执行</th><th>Agent</th><th>耗时</th><th>结果</th></tr>${rows}</table>`;

// ---- messages ----
const msgs = EVENTS.filter(e => e.event === "message");
document.getElementById("messages").innerHTML =
  `<table><tr><th>#</th><th>从</th><th>到</th><th>类型</th><th>内容摘要</th></tr>` +
  msgs.map((m, i) => `<tr><td>${i + 1}</td><td>${esc(m.from)}</td><td>${esc(m.to)}</td><td>${esc(m.kind)}</td><td><code>${esc(m.payload)}</code></td></tr>`).join("") +
  "</table>";

// ---- artifacts ----
let art = "";
if (ARTIFACTS.review) {
  const r = ARTIFACTS.review;
  art += `<details open><summary>审查结论：${r.passed ? "✅ 通过" : "❌ 未通过"}</summary>
    <p>${esc(r.summary || "")}</p>
    <table><tr><th>级别</th><th>来源</th><th>问题</th></tr>` +
    (r.issues || []).map(i => `<tr><td>${esc(i.severity || "")}</td><td>${esc(i.source || "")}</td><td>${esc(i.desc || "")}</td></tr>`).join("") +
    "</table></details>";
}
if (ARTIFACTS.code) art += `<details><summary>最终代码（点击展开）</summary><pre>${esc(ARTIFACTS.code)}</pre></details>`;
document.getElementById("artifacts").innerHTML = art || "<p>（无产物，运行未成功）</p>";
</script>
